services:
  # ----------------------------
  # 接入层 (Nginx 反向代理)
  # ----------------------------
  nginx:
    image: nginx:alpine
    container_name: goshort-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - redirect-service
      - api-service
      - frontend-service
    networks:
      - goshort-net

  # ----------------------------
  # 基础设施层 (Database & Cache)
  # ----------------------------
  postgres:
    image: postgres:15-alpine
    container_name: goshort-db
    restart: always
    environment:
      POSTGRES_USER: cmh
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: goshort
    ports:
      - "5432:5432" # 暴露给宿主机的数据库工具连接用
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - goshort-net

  redis:
    image: redis:alpine
    container_name: goshort-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - goshort-net

  kafka:
    # 官方 apache/kafka（KRaft 单机），环境变量为 KAFKA_*，与 Bitnami 的 KAFKA_CFG_* 不同
    # 若曾使用 Bitnami 卷，请 docker volume rm 对应 kafka 卷后重建，否则存储格式不兼容
    image: apache/kafka:latest
    hostname: kafka
    container_name: goshort-kafka
    restart: always
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - goshort-net

  # ----------------------------
  # 应用服务层 (Microservices)
  # ----------------------------
  
  # 1. 跳转服务 (核心读服务) - 模拟 8082 端口
  redirect-service:
    build:
      context: ..            # 上下文是项目根目录
      dockerfile: deploy/Dockerfile.redirect
    container_name: goshort-redirect
    restart: always
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8082:8080"            # 宿主机 8082 -> 容器 8080
    environment:
      - APP_ENV=production
      - DB_DSN=host=postgres user=cmh password=123456 dbname=goshort port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - KAFKA_BROKERS=kafka:9092
    networks:
      - goshort-net

  # 2. API 服务 (管理后台) - 模拟 8081 端口
  api-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: goshort-api
    restart: always
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8081:8080"          # 宿主机 8081 -> 容器 8080
    environment:
      - APP_ENV=production
      - DB_DSN=host=postgres user=cmh password=123456 dbname=goshort port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=youwillneverknow
      - BASE_URL=https://localhost
    networks:
      - goshort-net

  # 3. Worker 服务 (异步处理) - 无端口
  worker-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: goshort-worker
    restart: always
    depends_on:
      - postgres
      - kafka
    environment:
      - APP_ENV=production
      - DB_DSN=host=postgres user=cmh password=123456 dbname=goshort port=5432 sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    networks:
      - goshort-net

  # 4. Frontend 静态站点（由网关 Nginx 转发）
  frontend-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: goshort-frontend
    restart: always
    networks:
      - goshort-net

# 定义持久化卷
volumes:
  pg_data:
  redis_data:
  kafka_data:

# 定义内部网络
networks:
  goshort-net:
    driver: bridge