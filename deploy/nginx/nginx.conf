# Nginx 反向代理配置 - 按 URL 分流
# 支持 HTTP (80) 和 HTTPS (443)
#
# 使用 resolver + 变量 proxy_pass：Docker 重建容器后 IP 会变，静态 upstream 会导致 502，
# 动态解析可避免「Connection refused 连到旧 IP」。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # HTTP (80) 和 HTTPS (443) 共用以下配置
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 强制 HTTP -> HTTPS，统一通过 TLS 访问所有接口
        return 301 https://$host$request_uri;
    }

    # HTTPS (443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;

        # SSL 证书（自签名或 Let's Encrypt）
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        location /code/ {
            set $upstream_redirect redirect-service:8080;
            proxy_pass http://$upstream_redirect;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location /health {
            set $upstream_redirect redirect-service:8080;
            proxy_pass http://$upstream_redirect;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /metrics {
            set $upstream_redirect redirect-service:8080;
            proxy_pass http://$upstream_redirect;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            set $upstream_api api-service:8080;
            proxy_pass http://$upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            set $upstream_fe frontend-service:80;
            proxy_pass http://$upstream_fe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
