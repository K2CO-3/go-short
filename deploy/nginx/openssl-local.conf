# 本地开发自签名证书（CN + SAN，便于浏览器接受 localhost）
[req]
default_bits       = 2048
prompt             = no
default_md         = sha256
distinguished_name = dn
x509_extensions    = v3_req

[dn]
CN = localhost
O  = GoShort
C  = CN

[v3_req]
subjectAltName = @alt_names
basicConstraints = CA:FALSE
keyUsage = digitalSignature, keyEncipherment

[alt_names]
DNS.1 = localhost
IP.1  = 127.0.0.1
